<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChaloChale | Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <a href="" class="navbar-brand mx-2 fw-bold text-white">ChaloChale</a>

        <div class="navbar-nav d-flex flex-row">
            <a href="index.html" class="nav-link mx-3">Home</a>
            <a href="destination.html" class="nav-link mx-3">Destination</a>
            <a href="packages.html" class="nav-link mx-3">Packages</a>
            <a href="booking.html" class="nav-link mx-3 active">Booking</a>
            <a href="contact.html" class="nav-link mx-3">Contact</a>
            <a href="login.html" class="nav-link mx-1  bg-warning  px-3 rounded">Login</a>
            <a href="register.html" class="nav-link mx-3 bg-warning  px-3 rounded">Signup</a>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="py-5 bg-light text-center">
        <div class="container">
            <h1 class="fw-bold">Travel Booking Form</h1>
            <p class="lead">Explore amazing destinations around the world with ChaloChale.</p>
        </div>
    </section>
    <!-- Page Header end -->

    <!-- Booking Form -->

    <section class="py-5">
        <div class="container">

            <div class="row justify-content-center">

                <div class="col-12 col-md-10 col-lg-8">

                    <div class="card shadow-lg p-4 rounded-4">
                        <h3 class="fw-bold text-center mb-4">Book Your Trip</h3>

                        <form>
                            <div class="row mb-3">
                                <div class="col-6">
                                    <div class="col-12" col-md-6 mb-3>
                                        <label class="form-label" for="fullName">Full Name</label>
                                        <input type="text" class="form-control" id="fullName"
                                            placeholder="Enter your full name" />
                                    </div>
                                </div>

                                <div class="col-6">
                                    <div class="col-12" col-md-6 mb-3>
                                        <label class="form-label" for="email">Email</label>
                                        <input type="email" class="form-control" id="email"
                                            placeholder="Enter your email" />
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-6">
                                    <div class="col-12" col-md-6 mb-3>
                                        <label class="form-label" for="selectDestination">Select Destination</label>
                                        <select class="form-select" id="selectDestination">
                                            <option>Select a destination</option>
                                            <option value="goa">Goa</option>
                                            <option value="redFort">Red Fort</option>
                                            <option value="tajMahal">Taj Mahal</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="col-6">
                                    <div class="col-12" col-md-6 mb-3>
                                        <label class="form-label" for="date">Travel Date</label>
                                        <input type="date" class="form-control" id="date"
                                            placeholder="Enter your email" />
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 col-md-6 col-lg-12 mb-3">
                                <label class="form-label" for="people">Number of People</label>
                                <input type="number" class="form-control" id="people"
                                    placeholder="Enter number of people" />
                            </div>

                            <div class="col-12 col-md-6 col-lg-12 mb-3">
                                <label class="form-label" for="message">Message / Requirement</label>
                                <textarea class="form-control" id="message" rows="4"
                                    placeholder="Enter any Travel requirements or message"></textarea>
                            </div>

                            <button type="submit" class="btn btn-success w-100">Submit</button>
                        </form>
                    </div>

                </div>

            </div>

        </div>

        </div>

    </section>


    <footer class="bg-dark text-white text-center p-3 fs-6">
        &copy; 2026 ChaloChale Travel App | Designed with Bootstrap
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
