<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChaloChale | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <a href="index.html" class="navbar-brand mx-2 fw-bold text-white">ChaloChale</a>

        <div class="navbar-nav d-flex flex-row">
            <a href="index.html" class="nav-link mx-3">Home</a>
            <a href="destination.html" class="nav-link mx-3">Destination</a>
            <a href="packages.html" class="nav-link mx-3 ">Packages</a>
            <a href="booking.html" class="nav-link mx-3">Booking</a>
            <a href="contact.html" class="nav-link mx-3">Contact</a>
            <a href="login.html" class="nav-link mx-1 bg-warning  px-3 rounded  active">Login</a>
            <a href="register.html" class="nav-link mx-3 bg-warning mx-2 px-3 rounded">Signup</a>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">

                <div class="col-12 col-md-6 col-lg-5">
                    <div class="card shadow-lg p-4 rounded-4">
                        <h1 class="text-center fw-bold mb-3">Sign In</h1>

                        <form>
                            <div class="row">
                                <div class="col-12 mb-3">
                                    <label>Email</label>
                                    <input type="email" class="form-control" placeholder="Enter your email" />
                                </div>

                                <div class="col-12 mb-3">
                                    <label>Password</label>
                                    <input type="password" class="form-control" placeholder="Enter your password" />
                                </div>

                                <div class="col-12">
                                    <button class="btn btn-primary mb-3 w-100">Sign In</button>

                                </div>

                                <p class="text-center ">Don't have an account? <a href="register.html">Create Account</a></p>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
    </section>






    <footer class="bg-dark text-white text-center p-3 fs-6 mt-5">
        &copy; 2026 ChaloChale Travel App | Designed with Bootstrap
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
